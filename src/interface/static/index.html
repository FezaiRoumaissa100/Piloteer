<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Piloteer — AI SaaS Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js"></script>

  <style>
    /* ── Reset & tokens ────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0d0f14;
      --surface:     #13161d;
      --surface-2:   #1a1e28;
      --border:      #262b38;
      --accent:      #6c63ff;
      --accent-glow: rgba(108, 99, 255, 0.25);
      --accent-2:    #00d4aa;
      --text-1:      #eef0f7;
      --text-2:      #8b90a4;
      --text-3:      #555a6e;
      --user-bg:     #6c63ff;
      --agent-bg:    #1a1e28;
      --ask-bg:      rgba(0, 212, 170, 0.08);
      --ask-border:  #00d4aa;
      --success:     #00d4aa;
      --error:       #ff4d6d;
      --system:      #f0a500;
      --radius:      14px;
      --radius-sm:   8px;
      --font:        'Inter', sans-serif;
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text-1);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Header ─────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .logo ph-icon { color: white; font-size: 20px; }

    .header-text h1 {
      font-size: 15px; font-weight: 700;
      background: linear-gradient(90deg, var(--text-1), var(--text-2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .header-text p { font-size: 11px; color: var(--text-3); margin-top: 1px; }

    .status-dot {
      margin-left: auto;
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: var(--text-2);
    }

    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-3);
      transition: background 0.3s;
    }
    .dot.connected  { background: var(--success); box-shadow: 0 0 6px var(--success); }
    .dot.running    { background: var(--accent);  box-shadow: 0 0 6px var(--accent);
                      animation: pulse 1.2s ease-in-out infinite; }
    .dot.asking     { background: var(--ask-border); box-shadow: 0 0 6px var(--ask-border); }

    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* ── Messages area ───────────────────────────────── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── Message bubbles ─────────────────────────────── */
    .msg { display: flex; gap: 10px; max-width: 88%; animation: fadeIn 0.25s ease; }
    .msg.user  { align-self: flex-end; flex-direction: row-reverse; }
    .msg.agent, .msg.system, .msg.ask_user { align-self: flex-start; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .avatar {
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 14px;
    }

    .msg.agent .avatar  { background: linear-gradient(135deg, var(--accent), #8b5cf6); }
    .msg.user .avatar   { background: var(--user-bg); }
    .msg.system .avatar { background: var(--surface-2); border: 1px solid var(--border); color: var(--system); }
    .msg.success .avatar { background: rgba(0,212,170,0.15); color: var(--success); }
    .msg.error .avatar  { background: rgba(255,77,109,0.15); color: var(--error); }

    .bubble {
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 13.5px;
      line-height: 1.55;
      max-width: 100%;
      word-break: break-word;
    }

    .msg.user .bubble {
      background: var(--user-bg);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg.agent .bubble {
      background: var(--agent-bg);
      border: 1px solid var(--border);
      color: var(--text-1);
      border-bottom-left-radius: 4px;
    }

    .msg.system .bubble {
      background: rgba(240,165,0,0.07);
      border: 1px solid rgba(240,165,0,0.2);
      color: var(--system);
      font-size: 12px;
    }

    .msg.success .bubble {
      background: rgba(0,212,170,0.08);
      border: 1px solid rgba(0,212,170,0.25);
      color: var(--success);
    }

    .msg.error .bubble {
      background: rgba(255,77,109,0.08);
      border: 1px solid rgba(255,77,109,0.25);
      color: var(--error);
    }

    /* ask_user and success use the same style as agent bubbles */

    /* ── Typing indicator ────────────────────────────── */
    .typing { display: flex; align-items: center; gap: 4px; padding: 6px 0; }
    .typing span {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--text-3);
      animation: bounce 1.2s ease infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

    /* ── Input area ──────────────────────────────────── */
    #input-area {
      padding: 16px 20px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      transition: border-color 0.2s;
    }

    .input-row:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

    #msg-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text-1);
      font-family: var(--font);
      font-size: 13.5px;
      resize: none;
      line-height: 1.5;
      max-height: 120px;
      min-height: 22px;
    }

    #msg-input::placeholder { color: var(--text-3); }

    #send-btn {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      border: none;
      border-radius: 9px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s, transform 0.1s;
    }

    #send-btn:hover  { opacity: 0.85; }
    #send-btn:active { transform: scale(0.94); }
    #send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    #send-btn ph-icon { color: white; font-size: 16px; transition: opacity 0.2s; }
    
    #cancel-btn {
      width: 34px; height: 34px;
      background: var(--error);
      border: none;
      border-radius: 9px;
      cursor: pointer;
      display: none; /* hidden by default */
      align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s, transform 0.1s;
    }
    #cancel-btn:hover { opacity: 0.85; }
    #cancel-btn:active { transform: scale(0.94); }
    #cancel-btn ph-icon { color: white; font-size: 16px; }

    .spinner {
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .input-hint {
      font-size: 11px;
      color: var(--text-3);
      margin-top: 8px;
      text-align: center;
    }

    /* ── Step badge ──────────────────────────────────── */
    .step-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(108,99,255,0.1);
      border: 1px solid rgba(108,99,255,0.25);
      border-radius: 20px;
      padding: 2px 9px;
      font-size: 11px;
      color: var(--accent);
      margin-bottom: 5px;
    }
  </style>
</head>

<body>

  <!-- ── Header ─────────────────────────────────────────── -->
  <header>
    <div class="logo"><ph-icon name="robot" weight="fill"></ph-icon></div>
    <div class="header-text">
      <h1>Piloteer</h1>
      <p>Autonomous SaaS Agent</p>
    </div>
    <div class="status-dot">
      <div class="dot" id="status-dot"></div>
      <span id="status-label">Connecting...</span>
    </div>
  </header>

  <!-- ── Messages ───────────────────────────────────────── -->
  <div id="messages"></div>

  <!-- ── Input ──────────────────────────────────────────── -->
  <div id="input-area">
    <div class="input-row">
      <textarea
        id="msg-input"
        rows="1"
        placeholder="Describe what you want to automate..."
        disabled
      ></textarea>
      <button id="send-btn" disabled>
        <ph-icon name="paper-plane-tilt" weight="fill" id="send-icon"></ph-icon>
      </button>
      <button id="cancel-btn" title="Stop Task">
        <ph-icon name="stop" weight="fill"></ph-icon>
      </button>
    </div>
    <div class="input-hint">Press <kbd>Enter</kbd> to send · <kbd>Shift+Enter</kbd> for new line</div>
  </div>

<script>
  /* ── State ──────────────────────────────────────────────── */
  let ws = null;
  let isWaitingForReply = false;
  let isTaskRunning    = false;

  const messagesEl = document.getElementById("messages");
  const inputEl    = document.getElementById("msg-input");
  const sendBtn    = document.getElementById("send-btn");
  const sendIcon   = document.getElementById("send-icon");
  const cancelBtn  = document.getElementById("cancel-btn");
  const dot        = document.getElementById("status-dot");
  const statusLbl  = document.getElementById("status-label");

  /* ── WebSocket ──────────────────────────────────────────── */
  function connect() {
    ws = new WebSocket(`ws://${location.host}/ws`);

    ws.onopen = () => {
      setStatus("connected", "Connected");
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      handleMessage(data);
    };

    ws.onclose = () => {
      setStatus("", "Disconnected");
      setInputEnabled(false);
      appendMessage("system", "⚡", "Connection closed. Refresh to reconnect.");
    };

    ws.onerror = () => {
      setStatus("", "Error");
    };
  }

  /* ── Message handler ────────────────────────────────────── */
  function handleMessage(data) {
    const { type, content } = data;

    // System messages: silently handle logic, never display
    if (type === "system") {
      return;
    }

    if (type === "ask_user") {
      isWaitingForReply = true;
      appendMessage("agent", "robot", content);
      setInputEnabled(true);
      setStatus("asking", "Waiting for you...");
      return;
    }

    if (type === "success") {
      isTaskRunning = false;
      appendMessage("agent", "robot", content);
      setInputEnabled(true);
      setStatus("connected", "Ready");
      hideLoading();
      return;
    }

    if (type === "error") {
      isTaskRunning = false;
      appendMessage("error", "warning-circle", content);
      setInputEnabled(true);
      setStatus("connected", "Ready");
      hideLoading();
      return;
    }

    // Default: agent message (shown but does not re-enable input)
    appendMessage("agent", "robot", content);
  }

  /* ── Send ────────────────────────────────────────────────── */
  function send() {
    const text = inputEl.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

    appendMessage("user", "user", text);
    ws.send(text);
    inputEl.value = "";
    autoResize();

    if (isWaitingForReply) {
      isWaitingForReply = false;
      setStatus("running", "Agent thinking...");
      showLoading(false); // keep input enabled but show spinner
    } else {
      isTaskRunning = true;
      setInputEnabled(false);
      setStatus("running", "Agent running...");
      showLoading(true); // show spinner and cancel button
    }
  }

  function cancelTask() {
    if (!isTaskRunning || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send("__CANCEL__");
    hideLoading();
    setStatus("connected", "Cancelling...");
    appendMessage("system", "info", "Sending stop signal...");
  }

  function showLoading(showCancel) {
    sendIcon.setAttribute("name", "spinner-gap");
    sendIcon.classList.add("spinner");
    if (showCancel) {
      sendBtn.style.display = "none";
      cancelBtn.style.display = "flex";
    }
  }

  function hideLoading() {
    sendIcon.setAttribute("name", "paper-plane-tilt");
    sendIcon.classList.remove("spinner");
    sendBtn.style.display = "flex";
    cancelBtn.style.display = "none";
  }

  /* ── DOM helpers ─────────────────────────────────────────── */
  function appendMessage(type, icon, content) {
    const isUser = type === "user";

    const msg = document.createElement("div");
    msg.className = `msg ${type}`;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.innerHTML = `<ph-icon name="${icon}" weight="fill"></ph-icon>`;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = content;

    if (isUser) {
      msg.append(bubble, avatar);
    } else {
      msg.append(avatar, bubble);
    }

    messagesEl.appendChild(msg);
    scrollToBottom();
  }

  function appendAskUser(question) {
    // ask_user shown as a normal agent bubble - no special styling
    appendMessage("agent", "robot", question);
  }

  function setStatus(cls, label) {
    dot.className = `dot ${cls}`;
    statusLbl.textContent = label;
  }

  function setInputEnabled(enabled) {
    inputEl.disabled  = !enabled;
    sendBtn.disabled  = !enabled;
    if (enabled) inputEl.focus();
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function autoResize() {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
  }

  /* ── Keyboard shortcuts ──────────────────────────────────── */
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  inputEl.addEventListener("input", autoResize);
  sendBtn.addEventListener("click", send);
  cancelBtn.addEventListener("click", cancelTask);

  /* ── Init ────────────────────────────────────────────────── */
  connect();
</script>
</body>
</html>
